# Nginx configuration for Occupancy Tracking (Syncro)
# Place in /etc/nginx/sites-available/occupancy-tracking and symlink to sites-enabled/

server {
    listen 80;
    server_name your-domain.com;

    # Allow avatar and banner uploads up to 25MB
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Real-time SSE support for /api/events (disable buffering)
    location /api/events {
        proxy_pass http://127.0.0.1:3001/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Static uploads caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
